<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Kyle Wilson — And Xia Too</title>
<meta name="description" content="Kyle Wilson — And Xia Too" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&display=swap" rel="stylesheet" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    overflow: hidden;
    background: #020208;
    font-family: 'Cormorant Garamond', serif;
  }
  #stars {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
  }
  .nebula {
    position: fixed;
    border-radius: 50%;
    filter: blur(90px);
    opacity: 0.35;
    pointer-events: none;
  }
  .nebula.one {
    width: 55vmax; height: 55vmax;
    left: -15vmax; top: -15vmax;
    background: radial-gradient(circle, #2b1a5e 0%, transparent 70%);
    animation: drift1 40s ease-in-out infinite alternate;
  }
  .nebula.two {
    width: 48vmax; height: 48vmax;
    right: -12vmax; bottom: -14vmax;
    background: radial-gradient(circle, #0e3a5c 0%, transparent 70%);
    animation: drift2 52s ease-in-out infinite alternate;
  }
  .nebula.three {
    width: 30vmax; height: 30vmax;
    left: 55%; top: 60%;
    background: radial-gradient(circle, #4a1545 0%, transparent 70%);
    opacity: 0.22;
    animation: drift1 65s ease-in-out infinite alternate-reverse;
  }
  @keyframes drift1 {
    from { transform: translate(0, 0) scale(1); }
    to   { transform: translate(6vmax, 4vmax) scale(1.12); }
  }
  @keyframes drift2 {
    from { transform: translate(0, 0) scale(1.08); }
    to   { transform: translate(-5vmax, -6vmax) scale(1); }
  }
  main {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
  }
  h1 {
    color: #f2f0ff;
    font-weight: 300;
    font-size: clamp(2.6rem, 9vw, 6.5rem);
    letter-spacing: 0.32em;
    text-indent: 0.32em;
    text-align: center;
    text-shadow:
      0 0 24px rgba(150, 140, 255, 0.45),
      0 0 90px rgba(120, 110, 255, 0.25);
    opacity: 0;
    animation: fadein 2.6s ease-out 0.4s forwards;
  }
  @keyframes fadein {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .title-block {
    text-align: center;
  }
  .subtitle {
    color: rgba(216, 210, 255, 0.62);
    font-weight: 300;
    font-size: clamp(1rem, 3.2vw, 1.7rem);
    letter-spacing: 0.3em;
    text-indent: 0.3em;
    margin-top: 1.4rem;
    text-shadow: 0 0 18px rgba(150, 140, 255, 0.35);
    opacity: 0;
    animation: fadein 2.6s ease-out 1.8s forwards;
  }
  @media (prefers-reduced-motion: reduce) {
    .nebula { animation: none; }
    h1 { animation-duration: 0.1s; }
    .subtitle { animation-duration: 0.1s; }
  }
</style>
</head>
<body>
  <div class="nebula one"></div>
  <div class="nebula two"></div>
  <div class="nebula three"></div>
  <canvas id="stars"></canvas>
  <main>
    <div class="title-block">
      <h1>Kyle Wilson</h1>
      <p class="subtitle">And Xia too</p>
    </div>
  </main>
<script>
  const canvas = document.getElementById('stars');
  const ctx = canvas.getContext('2d');
  let stars = [];
  let w, h;

  function resize() {
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
    initStars();
  }

  function initStars() {
    const count = Math.min(420, Math.floor((w * h) / 4200));
    stars = [];
    for (let i = 0; i < count; i++) {
      stars.push({
        x: Math.random() * w,
        y: Math.random() * h,
        r: Math.random() * 1.4 + 0.2,
        baseAlpha: Math.random() * 0.7 + 0.15,
        twinkleSpeed: Math.random() * 0.02 + 0.004,
        phase: Math.random() * Math.PI * 2,
        drift: Math.random() * 0.12 + 0.02
      });
    }
  }

  function tick(t) {
    ctx.clearRect(0, 0, w, h);
    for (const s of stars) {
      s.y -= s.drift;
      if (s.y < -4) { s.y = h + 4; s.x = Math.random() * w; }
      const alpha = s.baseAlpha * (0.6 + 0.4 * Math.sin(s.phase + t * s.twinkleSpeed));
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(235, 232, 255, ${alpha.toFixed(3)})`;
      ctx.fill();
    }
    requestAnimationFrame(tick);
  }

  window.addEventListener('resize', resize);
  resize();
  requestAnimationFrame(tick);
</script>
</body>
</html>
